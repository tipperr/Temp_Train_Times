[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  ; All credentials and SSIDs are in include/secrets.h (gitignored)
  -D USER_SETUP_LOADED
  -include include/tft_setup.h